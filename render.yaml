# Render Blueprint for the FastAPI backend (the Next.js frontend is deployed on Vercel).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    rootDir: backend
    plan: free
    # Python version comes from .python-version in the repository root (3.12).
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Free instances have an ephemeral filesystem: the SQLite file is recreated (and re-seeded)
      # on each deploy/restart. For persistence, add a Render Disk mounted at /var/data and use
      # sqlite:////var/data/zoom_clone.db
      - key: DATABASE_URL
        value: sqlite:///./zoom_clone.db
      - key: SEED_ON_STARTUP
        value: "true"
      # Set these to your Vercel URL after deploying the frontend, e.g. https://zoom-clone.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
